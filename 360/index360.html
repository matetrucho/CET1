<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor 360° - Aulas del Colegio</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eaf2f8;
      margin: 0;
      padding: 0;
    }

    .header-content {
      position: relative;
      background-color: #1e3d59;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-content h1 {
      color: #fff;
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
      text-align: center;
    }

    .header-content a {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .header-content a:hover {
      text-decoration: underline;
    }

    .container {
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .visor-container {
      width: 100%;
      max-width: 850px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      padding: 30px;
      border: 3px solid #1e3d59;
    }

    .selector {
      text-align: center;
      margin-bottom: 25px;
    }

    .selector label {
      font-size: 18px;
      font-weight: bold;
      color: #1e3d59;
      margin-right: 12px;
    }

    select {
      padding: 10px 16px;
      border-radius: 8px;
      border: 2px solid #1e3d59;
      font-size: 16px;
      background-color: #f7f9fb;
      color: #1e3d59;
      cursor: pointer;
      transition: 0.3s ease-in-out;
    }

    select:hover {
      background-color: #e1ecf4;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 ratio */
      background-color: #dbe5f1;
      border-radius: 8px;
      overflow: hidden;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .iframe-container iframe.active {
      display: block;
    }

    footer {
      text-align: center;
      font-size: 14px;
      padding: 15px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="header-content">
    <a href="../Pagina/pag principal.html">Inicio</a>
    <h1>🔍 Visor 360° - Aulas del Colegio</h1>
  </div>

  <div class="container">
    <div class="visor-container">
      <div class="selector">
        <label for="aulaSelect">Selecciona un Sector:</label>
        <select id="aulaSelect" onchange="cambiarAula()">
          <option value="Entrada">Entrada</option>
          <option value="Patio">Patio</option>
          <option value="Pasillo">Pasillo</option>
          <option value="Taller">Taller</option>
        </select>
      </div>
      <div class="iframe-container">
        <iframe id="Entrada" class="active" allowfullscreen
          src="https://panoraven.com/es/edit/5rOk5hPrMJ/0eG12XMd"></iframe>
        <iframe id="Pasillo" allowfullscreen
          src="https://panoraven.com/es/edit/ixQqofNhbt/0dLM2Xa9"></iframe>
        <iframe id="Patio" allowfullscreen
          src="https://panoraven.com/es/embed/oTcVOZOZeW"></iframe>
        <iframe id="Taller" allowfullscreen
          src="https://panoraven.com/es/embed/N1bJf5FUMJ"></iframe>
      </div>
    </div>
  </div>

  <footer>
    © 2025 - Colegio Técnico | Proyecto de recorridos virtuales 360°
  </footer>

  <script>
    function cambiarAula() {
      const valor = document.getElementById("aulaSelect").value;

      document.querySelectorAll('.iframe-container iframe').forEach(iframe => {
        iframe.classList.remove('active');
      });

      document.getElementById(valor).classList.add('active');
    }
  </script>

</body>
</html>
